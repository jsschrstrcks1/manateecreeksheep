<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="32" fill="#1a1612"/>
  <rect x="4" y="4" width="184" height="184" rx="28" fill="none" stroke="#c8956c" stroke-width="2" opacity="0.4"/>
  <!-- Sheep silhouette -->
  <g transform="translate(96,88) scale(1.1)" fill="#c8956c">
    <!-- Body wool -->
    <ellipse cx="0" cy="8" rx="32" ry="24" fill="#d4a574"/>
    <circle cx="-18" cy="-4" r="10" fill="#d4a574"/>
    <circle cx="-6" cy="-12" r="10" fill="#d4a574"/>
    <circle cx="8" cy="-12" r="10" fill="#d4a574"/>
    <circle cx="20" cy="-6" r="9" fill="#d4a574"/>
    <circle cx="-24" cy="6" r="8" fill="#d4a574"/>
    <circle cx="26" cy="4" r="8" fill="#d4a574"/>
    <!-- Head -->
    <ellipse cx="-36" cy="4" rx="12" ry="10" fill="#a07850"/>
    <!-- Eye -->
    <circle cx="-39" cy="1" r="2.5" fill="#1a1612"/>
    <!-- Ear -->
    <ellipse cx="-42" cy="-6" rx="6" ry="3.5" transform="rotate(-30 -42 -6)" fill="#a07850"/>
    <!-- Legs -->
    <rect x="-18" y="26" width="5" height="18" rx="2" fill="#a07850"/>
    <rect x="-8" y="26" width="5" height="18" rx="2" fill="#a07850"/>
    <rect x="10" y="26" width="5" height="18" rx="2" fill="#a07850"/>
    <rect x="20" y="26" width="5" height="18" rx="2" fill="#a07850"/>
  </g>
  <!-- Text -->
  <text x="96" y="158" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="16" fill="#c8956c">MANATEE CREEK</text>
  <text x="96" y="176" text-anchor="middle" font-family="Georgia, serif" font-weight="400" font-size="12" fill="#a89880">SHEEP</text>
</svg>
